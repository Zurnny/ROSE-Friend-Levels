<rml>
    <head>
        <title>Party Finder</title>

        <link type="text/template" href="../templates/window-resizeable.html" />

        <style>
            /* ==== Parts of the page for one look only (the other look's part stays hidden) ==== */
            #game-party-finder.sp-theme-default .sp-only-steampunk { display: none; }
            #game-party-finder.sp-theme-steampunk .sp-only-default { display: none; }

            /* ==== Both looks ==== */
            #game-party-finder { width: 650dp; height: 450dp; min-width: 530dp; min-height: 150dp; }
            listbox { padding-right: 7dp; }
            listbox-item { padding: 4dp; }
            button.default { min-width: 110dp; }
            .party-tooltip-container { position: relative; display: block; }
            .party-advert:hover .party-tooltip-text { opacity: 1; visibility: visible; }
            .party-advert-header { padding-right: 18dp; height: 1.5em; }
            .party-advert-header td { cursor: hand; vertical-align: middle; }
            .party-owner-name-header { min-width: 150dp; }
            .party-owner-zone-header { width: 180dp; }
            .party-owner-zone { width: 180dp; font-weight: 850; }
            .party-level-range-header { width: 80dp; text-align: center; }
            .party-level-range { width: 80dp; text-align: right; padding-right: 5dp; color: rgb(180, 255, 180); }
            .invalid-level { color: rgb(255, 180, 180); }
            .party-member-count { width: 80dp; text-align: center; }
            .party-advert-text { color: rgba(230, 230, 230, 255); word-break: break-word; }
            tbody { padding: 4dp; }
            td:nth-child(1) { padding-left: 4dp; }
            #sp-lvc-timer { position: absolute; width: 1dp; height: 1dp; opacity: 0; pointer-events: none; animation: 5s sp-lvc-tick-a; }
            #sp-switch-timer { position: absolute; width: 1dp; height: 1dp; opacity: 0; pointer-events: none; animation: 2s sp-switch-tick-a; }

            /* ==== Default UI look only ==== */
            .sp-theme-default .party-tooltip-text { display: block; visibility: hidden; z-index: 1; clip: none; pointer-events: none; background: rgba(0, 0, 0, 240); color: #fff; text-align: center; border-radius: 3dp; padding: 5dp; width: auto; min-width: 200dp; opacity: 0; transition: opacity 0.25s; position: absolute; text-align: left; bottom: auto; top: 100%; left: 10dp; width: 450dp; word-break: break-word; }
            .sp-theme-default .party-advert-header td:hover { background: rgba(100, 100, 100, 80); }
            .sp-theme-default .party-owner-name { min-width: 150dp; font-weight: 850; color: yellow; }
            .sp-theme-default tbody:nth-child(even) { background: rgba(60, 60, 60, 80); }
            .sp-theme-default tbody.my-party { background: rgba(220, 180, 20, 80); }

            /* ==== Steampunk look only ==== */
            .sp-theme-steampunk .party-tooltip-text { display: block; visibility: hidden; z-index: 1; clip: none; pointer-events: none; background: rgba(36, 30, 25, 240); border: 1dp rgb(122, 86, 36); color: #fff; text-align: center; border-radius: 3dp; padding: 5dp; width: auto; min-width: 200dp; opacity: 0; transition: opacity 0.25s; position: absolute; text-align: left; bottom: auto; top: 100%; left: 10dp; width: 450dp; word-break: break-word; }
            .sp-theme-steampunk .party-advert-header td:hover { background: rgba(214, 170, 96, 40); }
            .sp-theme-steampunk .party-owner-name { min-width: 150dp; font-weight: 850; color: rgb(243, 211, 138); }
            .sp-theme-steampunk tbody:nth-child(even) { background: rgba(58, 46, 34, 90); }
            .sp-theme-steampunk tbody.my-party { background: rgba(214, 170, 96, 60); }

            @keyframes sp-lvc-tick-a { from { opacity: 0; } to { opacity: 0; } }
            @keyframes sp-lvc-tick-b { from { opacity: 0; } to { opacity: 0; } }
            @keyframes sp-switch-tick-a { from { opacity: 0; } to { opacity: 0; } }
            @keyframes sp-switch-tick-b { from { opacity: 0; } to { opacity: 0; } }
        </style>
        <script>
-- Theme check (add-on windows work with the default UI and with the Steampunk
-- UI theme). Steampunk is installed when styles/steampunk.css exists; then this
-- window gets the class sp-theme-steampunk and uses the Steampunk look,
-- otherwise sp-theme-default and the game's own look. SP_THEME says which.
pcall(function()
    local sp = false
    pcall(function()
        local f = io.open('Data/ui/themes/rose/styles/steampunk.css', 'r')
        if f then f:close(); sp = true end
    end)
    SP_THEME = sp and 'steampunk' or 'default'
    local body = document:GetElementById('game-party-finder')
    if body then
        body:SetClass('sp-theme-default', not sp)
        body:SetClass('sp-theme-steampunk', sp)
    end
    -- (parts written for the other look stay in the window, hidden)
end)
        </script>
        <script>
-- Level and class catcher (Friend Levels and Class Icons add-ons). This window
-- already shows names with their levels and classes (every member of every Party Finder advert). Every 5 seconds while
-- it is loaded, and when it opens, each real level goes into sp_level_cache.txt
-- (for the friend list and the Group Manager) and each class into
-- sp_job_cache.txt (for the class icons in party and group). It only reads what
-- the window draws.
pcall(function()
    local document = document
    local FILE = 'sp_level_cache.txt'
    local function each(list, fn)
        if not list then return end
        local i = list[0] and 0 or 1
        while list[i] do fn(list[i]); i = i + 1 end
    end
    -- class numbers -> names, as the class icons use them
    local IDS = { [0] = 'visitor', [111] = 'soldier', [121] = 'knight', [122] = 'champion',
        [211] = 'muse', [221] = 'mage', [222] = 'cleric', [311] = 'hawker', [321] = 'raider',
        [322] = 'scout', [411] = 'dealer', [421] = 'bourgeois', [422] = 'artisan' }
    local FIRST = { [1] = 'soldier', [2] = 'muse', [3] = 'hawker', [4] = 'dealer' }
    local VALID = {}
    for _, v in pairs(IDS) do VALID[v] = true end
    local function job_name(value)
        local n = tonumber(value)
        if n then return IDS[n] or FIRST[math.floor(n / 100)] or (n < 100 and 'visitor') or nil end
        local s = tostring(value or ''):lower():match('^%s*(.-)%s*$')
        return VALID[s] and s or nil
    end
    -- merge name=value lines into a file (only written when something changed)
    local function merge(file, seen, pattern)
        local cache, changed = {}, false
        pcall(function()
            local f = io.open(file, 'r')
            if not f then return end
            for line in f:lines() do
                local n, v = line:match(pattern)
                if n and n ~= '' then cache[n] = v end
            end
            f:close()
        end)
        for n, v in pairs(seen) do
            if cache[n] ~= v then cache[n] = v; changed = true end
        end
        if changed then
            pcall(function()
                local f = io.open(file, 'w')
                if not f then return end
                for n, v in pairs(cache) do f:write(n, '=', v, '\n') end
                f:close()
            end)
        end
    end
    local function catch()
        local want_lv = not SP_ADDON_ON or SP_ADDON_ON('friend_levels')
        local want_job = not SP_ADDON_ON or SP_ADDON_ON('class_icons')
        if not want_lv and not want_job then return end
        local levels, jobs, any_lv, any_job = {}, {}, false, false
        each(document:QuerySelectorAll('.sp-lv-src'), function(e)
            local name = e:GetAttribute('sp-name')
            name = name and tostring(name) or ''
            if name == '' then return end
            local lvl = tonumber(e:GetAttribute('sp-level'))
            if want_lv and lvl and lvl > 1 then levels[name] = string.format('%d', math.floor(lvl)); any_lv = true end
            local job = job_name(e:GetAttribute('sp-job'))
            if want_job and job then jobs[name] = job; any_job = true end
        end)
        if any_lv then merge(FILE, levels, '^(.-)=(%d+)%s*$') end
        if any_job then merge('sp_job_cache.txt', jobs, '^(.-)=(%a+)%s*$') end
    end
    document:AddEventListener('show', function() pcall(catch) end)
    local timer = document:GetElementById('sp-lvc-timer')
    local flip = false
    if timer then
        timer:AddEventListener('animationend', function()
            pcall(catch)
            flip = not flip
            timer.style.animation = '5s ' .. (flip and 'sp-lvc-tick-b' or 'sp-lvc-tick-a')
        end)
    end
end)
        </script>
    <script>
-- Add-on switches (the same script in every add-on window).
-- SP_ADDON_SWITCH friend_levels
-- SP_ADDON_SWITCH class_icons
-- An add-on counts as installed while its marker file
-- Data/ui/sp_addons/<key>.txt exists. The launcher copies the marker in with
-- the add-on and takes it out again with it, so a window that several add-ons
-- share only runs the parts of the add-ons that are installed.
-- The on/off switches are in Options > UI > Add-ons and are saved in
-- sp_addons.txt (the Ice UI uses the same file; nobody removes anyone else's
-- lines). This window reads it every 2 seconds. Everything is on by default.
pcall(function()
    local BODY = 'game-party-finder'
    -- key, class put on this window while that add-on is off or not installed ('' = none)
    local MINE = {{'friend_levels', ''}, {'class_icons', ''}}
    local installed = {}
    SP_ADDON_INSTALLED = function(key)
        -- the Steampunk UI theme has every add-on built in
        if SP_THEME == 'steampunk' then return true end
        if installed[key] == nil then
            installed[key] = true      -- if the game won't let the UI read files, assume installed
            pcall(function()
                local f = io.open('Data/ui/sp_addons/' .. key .. '.txt', 'r')
                if f then f:close() else installed[key] = false end
            end)
        end
        return installed[key]
    end
    local flags = {}
    local function read_flags()
        flags = {}
        pcall(function()
            local f = io.open('sp_addons.txt', 'r')
            if not f then return end
            for line in f:lines() do
                local k, v = line:match('^%s*([%w_]+)%s*=%s*(%d)')
                if k then flags[k] = v end
            end
            f:close()
        end)
    end
    -- SP_ADDON_ON(key): installed and not switched off. Reads the switches fresh
    -- unless called with fresh == false.
    SP_ADDON_ON = function(key, fresh)
        if not SP_ADDON_INSTALLED(key) then return false end
        if fresh ~= false then read_flags() end
        return flags[key] ~= '0'
    end
    local doc = document
    local function apply()
        read_flags()
        for _, m in ipairs(MINE) do
            local on = SP_ADDON_ON(m[1], false)
            if m[2] ~= '' then pcall(function() (doc:GetElementById(BODY) or doc):SetClass(m[2], not on) end) end
            -- a script in this window can register SP_ADDON_HOOK['<key>@<body id>'] = function(on) ... end
            local hook = SP_ADDON_HOOK and SP_ADDON_HOOK[m[1] .. '@' .. BODY]
            if hook then pcall(hook, on) end
        end
    end
    apply()
    doc:AddEventListener('show', function() pcall(apply) end)
    doc:AddEventListener('mouseover', function() pcall(apply) end)
    -- repeating 2 second check: two identical animations swapped each time one ends
    pcall(function()
        local timer = doc:GetElementById('sp-switch-timer')   -- the empty div at the end of the body
        local flip = false
        timer:AddEventListener('animationend', function()
            pcall(apply)
            flip = not flip
            timer.style.animation = '2s ' .. (flip and 'sp-switch-tick-b' or 'sp-switch-tick-a')
        end)
    end)
end)
    </script>
    </head>

    <body id="game-party-finder" template="window-resizeable">
        <div data-model="party-finder" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
            <div class="content-box" style="padding-top: 0dp; padding-bottom: 0dp; margin-bottom: 0dp;">
                <table class="party-advert-header">
                    <tr>
                        <td class="party-owner-name-header" data-event-click="sort_adverts('owner_name')"><str string-id="1272" /></td>
                        <td class="party-owner-zone-header" data-event-click="sort_adverts('owner_zone')">Zone</td>
                        <td class="party-level-range-header" data-event-click="sort_adverts('highest_member_level')"><str string-id="313" /></td>
                        <td class="party-member-count" data-event-click="sort_adverts('members.size')">Members</td>
                    </tr>
                </table>
            </div>

            <div style="flex: 1;" class="content-box">
                <div style="overflow: hidden scroll; width: 100%; height: 100%">
                    <table>
                        <tbody data-for="advert : party_adverts" class="party-advert" data-class-my-party="advert.party_id == player_party_id">
                            <tr>
                                <td class="party-owner-name">{{advert.members[0].name}}</td>
                                <td class="party-owner-zone"><str data-attr-zone-name="advert.members[0].zone" /></td>
                                <td class="party-level-range" data-class-invalid-level="abs(advert.highest_member_level - player_level) > max_level_difference_for_xp || abs(advert.lowest_member_level - player_level) > max_level_difference_for_xp">{{advert.lowest_member_level}} - {{advert.highest_member_level}}</td>
                                <td class="party-member-count">{{advert.members.size}} / {{advert.max_members}}</td>
                            </tr>
                            <tr style="min-height: 2.5em">
                                <td colspan="3">
                                    <span class="party-advert-text">{{advert.text}}</span>
                                    <div class="party-tooltip-container">
                                        <span class="party-tooltip-text">
                                            <div>{{advert.text}}</div>
                                            <br />
                                            <str string-id="489" />: <str data-attr-string-id="advert.rule_items ? 490 : 491" /><br/>
                                            <str ability-name="30" />: <str data-attr-string-id="advert.rule_xp ? 492 : 493" /><br/>
                                            <br />
                                            <table style="text-align: left">
                                                <tr data-for="member : advert.members" class="sp-lv-src" data-attr-sp-name="member.name" data-attr-sp-level="member.level" data-attr-sp-job="member.job">
                                                    <td>{{member.name}}</td>
                                                    <td style="width: 50dp">Lv{{member.level}}</td>
                                                    <td style="width: 90dp"><str data-attr-job-name="member.job"/></td>
                                                </tr>
                                            </table>
                                        </span>
                                    </div>
                                </td>
                                <td>
                                    <button class="default" style="min-width: 70dp; width: 100%;" data-if="!has_party && advert.members.size < advert.max_members && abs(advert.highest_member_level - player_level) <= max_level_difference_for_xp && abs(advert.lowest_member_level - player_level) <= max_level_difference_for_xp" data-attr-onclick="'advert_join(' + advert.party_id + ')'">Join</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div style="display: flex; flex-direction: row;">
                <span style="width: 150dp">
                    <button class="default" style="width: 150dp" onclick="advert_start" data-if="!has_party || (is_party_owner && !has_party_advert)">Start Advert</button>
                    <button class="default" style="width: 150dp" onclick="advert_stop" data-if="is_party_owner && has_party_advert">Stop Advert</button>
                </span>
                <span style="flex: 1"></span>
                <button class="default" style="width: 150dp" onclick="advert_start" data-visible-if="is_party_owner && has_party_advert">Edit Advert</button>
                <span style="flex: 1"></span>
                <button class="default" style="width: 150dp" onclick="advert_refresh">Refresh</button>
            </div>
        </div>
        <div id="sp-lvc-timer"></div>
        <div id="sp-switch-timer"></div>
    </body>
</rml>
