[Mod]
Name=Friend Levels
Version=1.8
Author=Zurnny
Group=
Description=Shows real levels for friends in the friend list and Group Manager. From start-up it collects levels from your clan list, your group and the Game Arena (the game sends level 1 for friends when it does not know). Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Works with the default UI and the Steampunk UI theme: each window checks which one is installed and uses its look (no launcher needed).
Priority=5
UpdateUrl=https://raw.githubusercontent.com/Zurnny/ROSE-Friend-Levels/main/Friend%20Levels/manifest.txt
