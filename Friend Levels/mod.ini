Description=Shows real levels for friends in the friend list and Group Manager. From start-up it collects levels from your clan list, your group and the Game Arena (the game sends level 1 for friends when it does not know). Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. The Steampunk UI theme already has this built in, so it isn't needed with Steampunk.
Changes=Brings its own switch in Options > UI > Add-ons (Options Extras no longer needed).
Priority=5
