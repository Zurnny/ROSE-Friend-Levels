Description=Shows real levels for friends in the friend list and Group Manager. From start-up it collects levels from your clan list, your group, the Game Arena and Party Finder adverts (the game sends level 1 for friends when it does not know).\nAdd-on for the game's default UI. The Steampunk UI theme already has this built in, so it isn't needed with Steampunk.
Changes=New level catcher: from start-up it reads levels from your clan list, the Game Arena and Party Finder adverts, so friends get levels without opening the Group Manager first.
Priority=5
