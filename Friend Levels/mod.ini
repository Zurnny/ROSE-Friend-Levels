Description=Shows real levels for friends in the friend list and Group Manager, remembered from your group and clan (the game sends level 1 when it does not know).\nAdd-on for the game's default UI. The Steampunk UI theme already has this built in, so it isn't needed with Steampunk.
Changes=Can be switched off in Options > UI > Add-ons (needs Options Extras); the game's own levels show while it is off.
