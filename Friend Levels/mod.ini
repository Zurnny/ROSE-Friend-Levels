[Mod]
Name=Friend Levels
Version=1.14
Author=Zurnny
Group=
Description=Shows real levels for friends in the friend list and Group Manager. It collects levels from your clan list, your group, the Game Arena and every Party Finder advert you look at, and remembers them (the game sends level 1 for friends when it does not know). Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=Clean-up: removed duplicate Steampunk styles, styles nothing used and unused script code. No change to how anything looks or works.
Priority=5
UpdateUrl=https://raw.githubusercontent.com/Zurnny/ROSE-Friend-Levels/main/Friend%20Levels/manifest.txt
